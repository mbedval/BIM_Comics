# Default Configuration for BIM Comics Renderers
# These settings will be loaded as defaults for both:
#   - BIS_convert_image.py
#   - BIS_create_comic_pages.py

# Default directory containing source images
storypath: "images/input/story1"

# Default rendering preset to apply (e.g., cartoon, anime, noir, newspaper, etc.)
preset: "all"

# Default root output directory for BIS_convert_image.py
outputpath: "images/output"

# Default output file path for BIS_create_comic_pages.py
outputfile: "images/output/comicspage/comic_page.png"
